name: Claude Code - Auto Issues from Email

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]

jobs:
  claude:
    # Trigger on new issues with the auto-request label that mention @claude,
    # OR on any comment that mentions @claude (for follow-ups)
    if: |
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Bash(gh pr create:*)"
            --append-system-prompt "After you commit and push your changes, open a pull request against main with gh pr create. Use a clear title and a short body that closes the issue (e.g. 'Closes #N'). Then include the PR link in your final comment."
